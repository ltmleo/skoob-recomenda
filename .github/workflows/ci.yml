# Pipeline (trunk-based).
#
#   PR para main  -> título no padrão Conventional Commits + lint + testes (Linux, macOS, Windows)
#   push na main  -> lint + testes -> release automático se houver feat/fix/perf/breaking
#
# Só a main gera versão: branches de trabalho nunca recebem tag nem release.
# A versão vem dos commits (scripts/next-version.sh); as tags são vX.Y.Z.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pr-title:
    name: Título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Com squash merge, o título do PR vira a mensagem do commit na main
          # e decide a versão do próximo release.
          re='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::Título fora do padrão: \"$TITLE\". Exemplos: 'feat(web): filtro por autor', 'fix: token expirado'."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Arquivos sem gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        # Versões antigas do govulncheck quebram (panic) com Go novo: manter
        # atualizado junto com o "go" do go.mod. A v1.9.0 exige Go >= 1.26.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: |
          flags=(-count=1)
          # -race precisa de cgo; os runners Linux e macOS já têm compilador C.
          [[ "$RUNNER_OS" != "Windows" ]] && flags+=(-race -coverprofile=coverage.out)
          go test "${flags[@]}" ./...
      - name: Cobertura
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: go build -o "$RUNNER_TEMP/recomenda-bin" ./cmd/recomenda

  release:
    name: Release
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico e tags completos para calcular a versão
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Próxima versão
        id: version
        run: |
          next="$(NOTES="$RUNNER_TEMP/notes.md" bash scripts/next-version.sh)"
          if [[ -z "$next" ]]; then
            echo "Nenhum feat/fix/perf desde a última tag: sem release." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "next=$next" >>"$GITHUB_OUTPUT"
          echo "tag=v$next" >>"$GITHUB_OUTPUT"

      - name: Binários
        if: steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="recomenda_${VERSION#v}_${os}_${arch}"
            ext=""; [[ "$os" == windows ]] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "build/$name/recomenda$ext" ./cmd/recomenda
            cp README.md LICENSE "build/$name/"
            if [[ "$os" == windows ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum ./* >checksums.txt)
          ls -l dist

      - name: Tag e release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A tag nasce junto com o release, no commit que passou nos testes.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "skoob-recomenda $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "Publicado: $TAG" >>"$GITHUB_STEP_SUMMARY"
